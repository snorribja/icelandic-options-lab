name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app.py pages options_lab ui

      - name: Smoke-test core imports
        run: |
          python -c "from options_lab.analysis import price_and_greeks"
          python -c "from options_lab.hedging import HedgeEngine"
          python -c "from options_lab.simulation import MonteCarlo"
